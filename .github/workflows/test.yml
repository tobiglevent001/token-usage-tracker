# Token Usage Tracker CI
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Syntax check all Python files
        run: |
          python -m py_compile scripts/fetch_usage.py
          python -m py_compile scripts/generate_report.py
          python -m py_compile scripts/run.py
          python -m py_compile scripts/utils.py
          python -m py_compile config/web_config.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 scripts/ config/ tests/ --max-line-length=120 --exclude=__pycache__,.venv
